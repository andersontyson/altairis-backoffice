services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: altairis-db
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=AltairisStrongPassword123!
      - MSSQL_PID=Developer
    ports:
      - "14330:1433"
    healthcheck:
      test: ["CMD", "/opt/mssql-tools18/bin/sqlcmd", "-S", "localhost", "-U", "sa", "-P", "AltairisStrongPassword123!", "-Q", "SELECT 1", "-C"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: altairis-backend
    environment:
      - ConnectionStrings__DefaultConnection=Server=db;Database=AltairisDb;User Id=sa;Password=AltairisStrongPassword123!;TrustServerCertificate=True
      - ASPNETCORE_ENVIRONMENT=Development
    ports:
      - "5000:8080"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend/altairis-frontend
      dockerfile: Dockerfile
    container_name: altairis-frontend
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:5000/api
    ports:
      - "3000:3000"
    depends_on:
      - backend
